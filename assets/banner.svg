<svg width="1000" height="200" viewBox="0 0 1000 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Silver Rodríguez — full-stack developer">
  <defs>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#00dae8" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#00dae8" stop-opacity="0.9"/>
      <stop offset="0.75" stop-color="#7c5cff" stop-opacity="0.9"/>
      <stop offset="1"    stop-color="#7c5cff" stop-opacity="0"/>
    </linearGradient>
    <style>
      .wave {
        stroke-dasharray: 4 8;
        animation: travel 3.2s linear infinite;
      }
      @keyframes travel {
        to { stroke-dashoffset: -24; }
      }
      .role {
        opacity: 0;
        animation: cycle 15s infinite;
        font: 500 15px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif;
        fill: #7d8697;
        letter-spacing: 0.2px;
      }
      @keyframes cycle {
        0%    { opacity: 0; }
        3.5%  { opacity: 1; }
        29%   { opacity: 1; }
        33%   { opacity: 0; }
        100%  { opacity: 0; }
      }
      .r2 { animation-delay: 5s; }
      .r3 { animation-delay: 10s; }
    </style>
  </defs>

  <rect width="1000" height="200" rx="14" fill="#0b0e14"/>
  <rect x="0.75" y="0.75" width="998.5" height="198.5" rx="13.25" stroke="#1b2230" stroke-width="1.5" fill="none"/>

  <!-- nombre -->
  <text x="500" y="92" text-anchor="middle"
        font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif"
        font-size="42" font-weight="700" letter-spacing="-0.5" fill="#e6ebf2">Silver Rodríguez</text>

  <!-- una sola onda, el unico movimiento -->
  <path class="wave"
        d="M 320 118 Q 335 106 350 118 T 380 118 T 410 118 T 440 118 T 470 118 T 500 118 T 530 118 T 560 118 T 590 118 T 620 118 T 650 118 T 680 118"
        stroke="url(#stroke)" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- roles, rotacion lenta -->
  <g text-anchor="middle">
    <text class="role"    x="500" y="156">full-stack dev · Arequipa, Perú</text>
    <text class="role r2" x="500" y="156">working on RedactorIA — tools for academic writing</text>
    <text class="role r3" x="500" y="156">side quest: heyro.ai — video that follows music</text>
  </g>
</svg>
